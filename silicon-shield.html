<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Silicon Shield</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<style>
/* Silicon Shield HUD — dark ops-room aesthetic, responsive for mobile. */

* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #060d18;
  --panel: rgba(10, 20, 34, 0.88);
  --panel-border: rgba(90, 130, 180, 0.25);
  --text: #dbe6f4;
  --dim: #8fa3bd;
  --blue: #3d8bff;
  --red: #e14b3c;
  --gold: #e8b64c;
  --green: #46b26b;
}

html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
  position: fixed; inset: 0;
}

#app { position: fixed; inset: 0; }
#scene { position: absolute; inset: 0; touch-action: none; overscroll-behavior: none; }
/* cinematic vignette over the 3D view; lets input through */
#scene::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 52%, rgba(2, 6, 12, 0.5) 100%);
}
#scene canvas { display: block; touch-action: none; }

/* ---------------------------------------------------------------- topbar */
#topbar {
  position: absolute; top: 0; left: 0; right: 0; min-height: 52px;
  display: flex; align-items: center; gap: 14px;
  /* base 0/12px padding, grown by notch safe-area insets where present (no-op on desktop) */
  padding: max(0px, env(safe-area-inset-top))
           max(12px, env(safe-area-inset-right))
           0
           max(12px, env(safe-area-inset-left));
  background: linear-gradient(180deg, rgba(4, 9, 16, 0.95), rgba(4, 9, 16, 0.6) 80%, transparent);
  z-index: 20; pointer-events: none;
}
#topbar > * { pointer-events: auto; }
#brand {
  font-weight: 800; letter-spacing: 0.16em; font-size: 15px; color: var(--gold);
}
#brand span { color: var(--text); font-weight: 300; margin-left: 4px; }
#turninfo { display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
#dayLabel { font-weight: 700; }
#cpLabel { color: var(--gold); font-weight: 700; }
#topbtns { margin-left: auto; display: flex; gap: 8px; }
#topbtns button, #turninfo { white-space: nowrap; }

button {
  font: inherit; color: var(--text);
  background: rgba(30, 48, 72, 0.9);
  border: 1px solid var(--panel-border);
  border-radius: 8px; padding: 7px 12px; cursor: pointer;
  transition: background 0.15s, transform 0.05s;
}
button:hover:not(:disabled) { background: rgba(50, 76, 110, 0.95); }
button:active:not(:disabled) { transform: scale(0.97); }
button:disabled { opacity: 0.38; cursor: default; }
button.primary { background: #1d4f8f; border-color: #3d77c2; font-weight: 700; }
button.primary:hover:not(:disabled) { background: #2763ad; }

/* ---------------------------------------------------------------- tracks */
#tracks {
  position: absolute; top: 58px; right: 8px; width: 215px;
  background: var(--panel); border: 1px solid var(--panel-border);
  border-radius: 10px; padding: 8px 10px; z-index: 15;
  backdrop-filter: blur(6px);
}
/* strip is desktop-hidden by default; the mobile-collapse media query below
   (max-width: 700px) is the only place that turns it on */
#tracksStrip { display: none; }
.track { display: flex; align-items: center; gap: 6px; margin: 5px 0; font-size: 11px; }
.tlabel { flex: 0 0 78px; color: var(--dim); }
.bar { flex: 1; height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
.intv .fill { background: var(--blue); }
.tw .fill { background: var(--green); }
.prc .fill { background: var(--red); }
.sup .fill { background: var(--gold); }
.tval { flex: 0 0 30px; text-align: right; font-variant-numeric: tabular-nums; }
.airgauge { flex: 1; display: flex; gap: 2px; }
.airgauge i { flex: 1; height: 8px; background: rgba(255,255,255,0.08); border-radius: 2px; }
.airgauge i.on.red { background: var(--red); }
.airgauge i.on.blue { background: var(--blue); }
.airgauge i.on.mid { background: var(--dim); }
.inventories {
  display: flex; justify-content: space-between; gap: 4px;
  margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--panel-border);
  font-size: 11px; color: var(--dim); flex-wrap: wrap;
}
.inventories b { color: var(--text); font-variant-numeric: tabular-nums; }

/* -------------------------------------------------------------- hint bar */
#hintBar {
  position: absolute; top: 58px; left: 50%; transform: translateX(-50%);
  background: rgba(30, 50, 20, 0.92); border: 1px solid #6a9a4a;
  border-radius: 8px; padding: 8px 12px; z-index: 25;
  display: flex; gap: 10px; align-items: center; font-size: 13px;
  max-width: min(480px, 92vw);
}
#hintBar.hidden { display: none; }
#hintCancel { padding: 2px 8px; }

/* ------------------------------------------------------------ unit panel */
#unitPanel {
  position: absolute; left: 8px; bottom: 118px; width: 250px;
  background: var(--panel); border: 1px solid var(--panel-border);
  border-radius: 10px; padding: 10px 12px; z-index: 15;
  backdrop-filter: blur(6px); font-size: 12px;
}
#unitPanel.hidden { display: none; }
#unitClose { position: absolute; top: 6px; right: 6px; padding: 2px 8px; font-size: 11px; }
#unitName { font-size: 14px; padding-right: 26px; }
#unitName.red { color: #ff9b8e; }
#unitName.blue { color: #9cc4ff; }
#unitType { color: var(--dim); margin: 1px 0 4px; }
#unitHp { color: var(--gold); letter-spacing: 2px; margin-bottom: 3px; }
#unitStats { margin-bottom: 3px; }
#unitStatus { color: var(--dim); font-style: italic; }
#unitExtra { margin-top: 5px; color: var(--dim); line-height: 1.45; }
#unitExtra b { color: var(--text); }
#unitButtons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ubtn { font-size: 12px; padding: 5px 9px; }

/* ------------------------------------------------------------ action bar */
#actionBar {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 46px;
  display: flex; gap: 6px; z-index: 15;
  /* base 6px/8px padding, grown by safe-area insets where present (no-op on desktop) */
  padding: 6px max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  background: var(--panel); border: 1px solid var(--panel-border);
  border-radius: 12px; backdrop-filter: blur(6px);
  max-width: 96vw; overflow-x: auto;
}
.actBtn {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  min-width: 58px; padding: 5px 6px; position: relative; border-radius: 9px;
}
.aicon { font-size: 17px; line-height: 1.1; }
.alabel { font-size: 9.5px; color: var(--dim); white-space: nowrap; }
.abadge {
  position: absolute; top: -6px; right: -4px; font-size: 9px;
  background: #24466e; border: 1px solid var(--panel-border);
  padding: 1px 5px; border-radius: 8px; color: var(--gold);
}

/* ------------------------------------------------------------------- log */
#logPanel {
  position: absolute; z-index: 14;
  /* base 8px/8px/6px offsets, grown by safe-area insets where present (no-op on desktop) */
  left: max(8px, env(safe-area-inset-left));
  right: max(8px, env(safe-area-inset-right));
  bottom: max(6px, env(safe-area-inset-bottom));
}
#logToggle {
  width: 100%; text-align: left; font-size: 12px; color: var(--dim);
  background: var(--panel); overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
#logEntries {
  display: none; max-height: 34vh; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--panel-border);
  border-radius: 8px; margin-bottom: 4px; padding: 6px 8px; font-size: 12px;
}
#logPanel.open #logEntries { display: block; }
.logEntry { padding: 3px 2px; border-bottom: 1px solid rgba(255,255,255,0.05); line-height: 1.4; }
.logEntry .lt { color: var(--dim); margin-right: 7px; font-size: 10px; }
.logEntry.alert { color: #ffd9a0; }
.logEntry.event { color: #b9e29a; }
.logEntry.missile { color: #f0a9a0; }
.logEntry.political { color: #a9c8f0; }

/* --------------------------------------------------------------- banners */
#bannerLayer { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
.banner {
  position: absolute; top: 20%; left: 50%; transform: translate(-50%, -20px);
  font-size: clamp(18px, 4vw, 30px); font-weight: 800; letter-spacing: 0.14em;
  color: #ffe1b0; text-shadow: 0 2px 18px rgba(0,0,0,0.9), 0 0 40px rgba(255,120,60,0.4);
  opacity: 0; transition: opacity 0.35s, transform 0.35s; white-space: nowrap;
}
.banner.show { opacity: 1; transform: translate(-50%, 0); }
.toast {
  position: absolute; bottom: 150px; left: 50%; transform: translate(-50%, 10px);
  background: rgba(20, 34, 54, 0.95); border: 1px solid var(--panel-border);
  padding: 8px 16px; border-radius: 8px; font-size: 13px;
  opacity: 0; transition: opacity 0.3s, transform 0.3s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------------------------------------------------------------- modals */
#modalLayer {
  position: absolute; inset: 0; z-index: 40;
  background: rgba(2, 6, 12, 0.72);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(3px);
}
#modalLayer.hidden { display: none; }
.modal {
  width: min(480px, 92vw); max-height: 86vh; overflow-y: auto;
  background: #0c1828; border: 1px solid rgba(120, 160, 210, 0.35);
  border-radius: 14px; padding: 22px 24px;
  box-shadow: 0 18px 60px rgba(0,0,0,0.6);
}
.modal.wide { width: min(640px, 94vw); }
.modal h2 { font-size: 19px; margin-bottom: 12px; color: var(--gold); letter-spacing: 0.04em; }
.modal .mbody { font-size: 13.5px; line-height: 1.55; color: var(--text); }
.modal .mbody p { margin: 8px 0; }
.modal .mbody ul { margin: 8px 0 8px 18px; }
.modal .mbody li { margin: 4px 0; }
.modal .mbody .dim { color: var(--dim); }
.modal .mbtns { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; justify-content: flex-end; }
.modal .mbtns button { min-width: 110px; padding: 10px 16px; }

/* after-action report */
.aar-h { color: var(--gold); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; margin: 14px 0 6px; }
.aar-grid {
  display: grid; grid-template-columns: auto 1fr; gap: 3px 14px;
  font-size: 12.5px; align-items: baseline;
}
.aar-k { color: var(--dim); white-space: nowrap; }
.aar-v { font-variant-numeric: tabular-nums; }
.aar-timeline { max-height: 32vh; overflow-y: auto; font-size: 12.5px; border-top: 1px solid var(--panel-border); }
.aar-t { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.06); line-height: 1.45; }
.aar-day { color: var(--gold); font-weight: 700; margin-right: 8px; font-variant-numeric: tabular-nums; }

.diffCard {
  border: 1px solid var(--panel-border); border-radius: 10px;
  padding: 10px 12px; margin: 8px 0; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.diffCard:hover { border-color: var(--gold); background: rgba(232, 182, 76, 0.07); }
.diffCard b { color: var(--gold); }
.diffCard .dim { display: block; font-size: 12px; margin-top: 2px; }

/* ------------------------------------------------ minimap, hover tip, tour */
#minimap {
  position: absolute; left: 10px; top: 60px; width: 150px; height: auto; z-index: 15;
  background: rgba(4, 9, 16, 0.75); border: 1px solid var(--panel-border); border-radius: 10px;
  padding: 4px; cursor: pointer; backdrop-filter: blur(6px);
}
#hoverTip {
  position: absolute; display: none; z-index: 30; pointer-events: none;
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px;
  padding: 6px 9px; font-size: 12px; line-height: 1.5; max-width: 260px;
}
#hoverTip .blue { color: #9cc4ff; } #hoverTip .red { color: #ffb0a8; }
#tourLayer { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
#tourHole {
  position: absolute; display: none; border: 2px solid var(--gold); border-radius: 12px;
  box-shadow: 0 0 0 9999px rgba(2, 6, 12, 0.6), 0 0 22px rgba(232, 182, 76, 0.5);
}
#tourCard {
  position: absolute; left: 50%; bottom: 130px; transform: translateX(-50%);
  width: min(440px, 92vw); pointer-events: auto;
  background: var(--panel); border: 1px solid var(--gold); border-radius: 12px;
  padding: 14px 16px; backdrop-filter: blur(8px); box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}
#tourCard .tstep { font-size: 11px; color: var(--gold); letter-spacing: 1px; }
#tourCard h3 { margin: 4px 0 6px; font-size: 16px; }
#tourCard p { font-size: 13px; line-height: 1.5; color: var(--text); }
#tourCard .tbtns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
#tourCard button { padding: 8px 14px; font-size: 13px; }

/* ------------------------------------------------ odds card, score, settings */
.oddsHead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; }
.oddsRow { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 10px; margin: 4px 0; font-size: 12px; }
.oddsBar { height: 10px; background: rgba(255,255,255,0.08); border-radius: 5px; overflow: hidden; }
.oddsBar i { display: block; height: 100%; border-radius: 5px; }
.oddsBar.atk i { background: var(--blue); }
.oddsBar.def i { background: var(--red); }
.oddsLine { margin-top: 8px; font-size: 12.5px; line-height: 1.45; }
.aar-score { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 2px 0 10px; font-size: 14px; }
.aar-score .stars { color: var(--gold); letter-spacing: 2px; font-size: 18px; }
.aar-score .title { color: var(--dim); font-style: italic; }
.aar-score .record { color: var(--green); font-weight: 700; }
.setRow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--panel-border); font-size: 13px; }
.setRow:last-child { border-bottom: none; }
.setRow input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--blue); }
.setRow select { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid var(--panel-border); border-radius: 6px; padding: 4px 8px; font-size: 13px; }

/* ---------------------------------------------------------------- mobile */
@media (max-width: 760px) {
  #brand { display: none; }
  /* five controls across 375px: tighten so the menu button isn't clipped */
  #topbar { gap: 6px; }
  #topbtns { gap: 4px; }
  #topbtns button { padding-left: 8px; padding-right: 8px; font-size: 13px; }
  #turninfo { font-size: 13px; }
  #tracks {
    top: auto; bottom: 96px; right: 4px; left: auto; width: 178px;
    font-size: 10px; padding: 6px 8px;
  }
  .tlabel { flex-basis: 64px; }
  #unitPanel { left: 4px; right: auto; bottom: 96px; width: min(230px, 55vw); }
  #minimap { width: 104px; top: 54px; left: 6px; padding: 3px; }
  #tourCard { bottom: 150px; }
  #actionBar {
    bottom: 36px; gap: 4px;
    padding: 5px max(6px, env(safe-area-inset-right)) max(5px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
  }
  .actBtn { min-width: 50px; }
  #logPanel { bottom: max(4px, env(safe-area-inset-bottom)); }
  #topbar { min-height: 46px; }

  /* -------------------------------------------------- unit panel: phones
     Cap the panel so it can never grow tall enough to cover the action
     bar; #unitClose stays put (position:absolute against #unitPanel, its
     own positioned + scrolling ancestor) so it never scrolls out of reach. */
  #unitPanel { max-height: 45vh; overflow-y: auto; }

  /* ------------------------------------------------------- modals: phones
     Was: overflow-y:auto on .modal itself, so long content dragged the
     title and button row along with it and off-screen. Now the modal is a
     fixed-height column with title/buttons pinned and only .mbody scrolling. */
  .modal {
    max-height: 85vh; max-height: 85dvh;
    display: flex; flex-direction: column; overflow-y: hidden;
  }
  .modal h2, .modal .mbtns { flex: 0 0 auto; }
  .modal .mbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
}

/* ------------------------------------------------- tracks collapse: phones
   Below ~700px the #tracks panel would otherwise eat the lower-right
   quarter of the map, so it collapses to a one-row strip of dots/values;
   tapping the strip (see UI._buildTracks in src/ui.js) toggles #tracks's
   .collapsed class. #tracksStrip defaults to display:none (base rule near
   #tracks above) and is only switched on here, and default-collapsed state
   is only ever set below this breakpoint (matchMedia check in
   _buildTracks). */
@media (max-width: 700px) {
  #tracksStrip {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; line-height: 1; cursor: pointer;
    white-space: nowrap;
  }
  #tracks:not(.collapsed) #tracksStrip {
    margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--panel-border);
  }
  /* collapsed strip is wider than the fixed 178px panel — size to content */
  #tracks.collapsed { padding: 7px 9px; width: auto; max-width: calc(100vw - 12px); }
  #tracks.collapsed .track,
  #tracks.collapsed .inventories { display: none; }
}

/* --------------------------------------------- touch targets: coarse pointers
   Apple/Google HIG minimum is ~44px; the desktop-tuned buttons below run
   smaller than that, which is fine for a mouse but too fiddly for a
   fingertip. Bump the hit area on touch devices only — mouse/trackpad
   layouts (and their tighter spacing) are untouched. */
@media (pointer: coarse) {
  .actBtn, .ubtn, #endTurnBtn, #menuBtn, #muteBtn, #unitClose {
    min-width: 44px; min-height: 44px;
  }
  /* the close button grew — give the title more clearance so they don't overlap */
  #unitName { padding-right: 48px; }

  /* ---------------------------------------------- action bar: coarse pointers
     Horizontal scroll already existed (overflow-x:auto); add the affordances
     a touch user expects: inertial (momentum) scrolling, buttons that snap
     into place instead of landing half-cut, and a subtle fade over the
     trailing edge that only shows while there's more to scroll to (a pure-CSS
     scroll-shadow: a "cover" gradient scrolls with the content — attachment:
     local — matching the fade until the last button reaches the edge, at
     which point it no longer covers it). */
  #actionBar {
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
    background:
      linear-gradient(to left, var(--panel) 40%, rgba(0,0,0,0)) right center / 32px 100% local no-repeat,
      linear-gradient(to left, rgba(2,6,12,0.55), rgba(2,6,12,0)) right center / 18px 100% scroll no-repeat,
      var(--panel);
  }
  .actBtn { scroll-snap-align: start; }
}

</style>
</head>
<body>
  <div id="app">
    <div id="scene"></div>

    <header id="topbar">
      <div id="brand">SILICON<span>SHIELD</span></div>
      <div id="turninfo">
        <span id="dayLabel">D+1</span>
        <span id="cpLabel">CP 6</span>
      </div>
      <div id="topbtns">
        <button id="endTurnBtn" class="primary">End Turn ⏵</button>
        <button id="menuBtn" title="Menu">☰</button>
      </div>
    </header>

    <aside id="tracks"></aside>

    <div id="hintBar" class="hidden"><span></span><button id="hintCancel">✕</button></div>

    <section id="unitPanel" class="hidden">
      <button id="unitClose">✕</button>
      <h3 id="unitName"></h3>
      <div id="unitType"></div>
      <div id="unitHp"></div>
      <div id="unitStats"></div>
      <div id="unitStatus"></div>
      <div id="unitExtra"></div>
      <div id="unitButtons"></div>
    </section>

    <nav id="actionBar"></nav>

    <section id="logPanel">
      <button id="logToggle"><span id="logLatest">Situation reports…</span></button>
      <div id="logEntries"></div>
    </section>

    <div id="bannerLayer"></div>
    <div id="modalLayer" class="hidden"></div>

the escort backbone of an invasion fleet. China now launches more naval tonnage annually than
any other country; these ships carry deep magazines of YJ-18 anti-ship missiles and modern
air defenses.</p><p><i>In game:</i> the fleet's shield. Kill the amphibs first \u2014 but SAGs
will punish your navy and shore targets if left alone.</p>`,cv:`<p>A PLAN <b>carrier group</b> \u2014 Liaoning/Shandong class, with the catapult-equipped
Fujian working up. PLA carriers are still learning blue-water operations; analysts see them
as most useful east of Taiwan, cutting the island off from US relief.</p><p><i>In game:</i>
adds air points to the superiority contest and escorts the fleet. A prestige target: sinking
it hits Beijing's resolve hard.</p>`,amph:`<p>An <b>amphibious flotilla</b> \u2014 Type 075/071 assault ships, landing ship tanks,
and requisitioned civilian RO-RO ferries the PLA has exercised with since 2021. Sealift is
the invasion's scarcest resource: CSIS wargames found the amphibious fleet is the center of
gravity of the entire operation.</p><p><i>In game:</i> each flotilla carries two brigades.
Every one sunk is two brigades that never land \u2014 this is how you win.</p>`,redSSN:`<p>A PLAN <b>nuclear attack submarine</b> (Type 093). Quieter with each block,
tasked with sinking allied carriers and interdicting reinforcement from Guam and Hawaii.</p>
<p><i>In game:</i> hidden until it fires. Screen your carriers and hunt it with your own subs.</p>`,redSSK:`<p>A <b>diesel-electric submarine flotilla</b> (Type 039). Slow but nearly silent
on batteries, ideal for ambush positions in the strait's shallow approaches.</p>
<p><i>In game:</i> hidden until it fires; a threat to convoys and your surface fleet.</p>`,redInf:`<p>A PLA <b>amphibious combined-arms brigade</b> \u2014 the specialized first-wave
formations of the Eastern and Southern Theater Commands, equipped with amphibious IFVs.
There are only about a dozen of these in the whole PLA; they are hard to replace.</p>
<p><i>In game:</i> the landing force. Destroy them on the water or at the beach.</p>`,redArm:`<p>A PLA <b>heavy combined-arms brigade</b> \u2014 main battle tanks and tracked
artillery, the exploitation force for after a port or beachhead is secured. Getting armor
ashore requires a working port or captured RO-RO ramp \u2014 a key invasion bottleneck.</p>
<p><i>In game:</i> arrives in follow-on echelons; dangerous once ashore, brittle at sea.</p>`,redMar:`<p>A <b>PLAN Marine Corps brigade</b> \u2014 expanded from two to eight brigades since
2017, trained for island seizure and port capture.</p><p><i>In game:</i> first-wave assault
troops, lighter than army heavy brigades.</p>`,redAB:`<p>A <b>PLA Airborne Corps brigade</b>. Chinese doctrine calls for vertical
envelopment \u2014 seizing airfields behind the beaches so follow-on forces can air-land. CSIS
wargames rate this among the operation's riskiest moves.</p><p><i>In game:</i> can drop on
airbases, cities and plains near red airbases. Kill the drop zones' garrisons or retake them
fast \u2014 a lodged airhead splits your defense.</p>`,redWingA:`<p><b>J-20 stealth fighter wing</b> \u2014 China's fifth-generation air-superiority
fighter, fielded in growing numbers. Its job is sweeping the strait's air space, not ground
attack.</p><p><i>In game:</i> big air-superiority contribution, modest strike power.</p>`,redWingB:`<p><b>J-16 strike wing</b> \u2014 a heavily-armed Flanker derivative, the PLAAF's
workhorse for maritime and ground strike under fighter escort.</p><p><i>In game:</i> the
PLA's best strike aircraft; a threat to your navy and bases.</p>`,redWingC:`<p><b>J-10 fighter wing</b> \u2014 single-engine multirole fighters in large numbers;
the mass behind the PLAAF's sortie generation.</p><p><i>In game:</i> a solid all-rounder that
pads red air superiority.</p>`,redBmb:`<p><b>H-6K bomber wing</b> \u2014 China's long-serving strategic bomber, modernized to
carry six long-range cruise missiles. H-6s ring Taiwan in nearly every large PLA exercise;
their standoff range means they rarely need to enter defended airspace.</p><p><i>In game:</i>
10-hex strike radius and the heaviest punch in the red air order of battle. Killing its base
is easier than killing the bomber.</p>`,rocArm:`<p>A <b>ROC Army armor brigade</b> \u2014 M60A3s and CM-11s, now being joined by M1A2T
Abrams. Taiwan's counterattack doctrine holds armor inland to smash a beachhead before it
consolidates: the "decisive battle at the water's edge."</p><p><i>In game:</i> your hammer.
Keep it out of missile range, then counterattack landings hard. Cannot enter high mountains.</p>`,rocInf:`<p>A <b>ROC Army mechanized infantry brigade</b> \u2014 CM-32 Clouded Leopard vehicles;
the garrison backbone of the western plain. Urban terrain multiplies its defense \u2014 a lesson
reinforced by Ukraine's cities.</p><p><i>In game:</i> holds cities and beaches; strongest on
the defense in urban hexes.</p>`,rocRes:`<p>A <b>reserve brigade</b>. Taiwan claims over 2 million reservists but the
system's training days and equipment have lagged; reforms since 2022 aim to fix it. Their
wartime value is one of the great unknowns of the scenario.</p><p><i>In game:</i> cheap
infantry mobilized via the Reserves action \u2014 thin alone, useful as urban filler.</p>`,rocMar:`<p>A <b>ROC Marine brigade</b> \u2014 the 66th and 99th are among Taiwan's readiest
formations, often tasked with the capital's defense and rapid counter-landing reaction.</p>
<p><i>In game:</i> mobile, reliable infantry.</p>`,rocGar:`<p>An <b>offshore island defense command</b>. Kinmen sits 10 km off Xiamen; it
weathered massive PRC artillery bombardment in 1958 and remains honeycombed with tunnels,
bunkers and coastal guns. Matsu and Penghu are similarly fortified. Politically, the islands
are a dilemma: Beijing could seize them as a fait accompli \u2014 but that might harden, not
break, Taiwan's resolve.</p><p><i>In game:</i> immobile fortress with shore batteries \u2014 it
fires automatically at ships and troops in range at the end of each PLA turn. It cannot be
reinforced or evacuated; its job is to make every island grab cost time, ships and resolve.</p>`,rocNav:`<p>A <b>ROCN surface flotilla</b> \u2014 Kidd-class destroyers, Perry- and
Lafayette-class frigates, and Tuo Chiang stealth missile corvettes. Against PLAN numbers,
Taiwan's navy survives by dispersing and striking from cover, not by fleet battle.</p>
<p><i>In game:</i> a ship-killer that dies fast in the open. Use it from coastal hexes,
alongside ASCM salvos.</p>`,rocSub:`<p>A <b>ROCN submarine</b> \u2014 for decades just two elderly Dutch-built boats; the
indigenous Hai Kun class began sea trials in 2024. Even a few boats in the strait's shallow
approaches threaten the landing fleet's tight formations.</p><p><i>In game:</i> hidden until
it fires; best used against amphibious flotillas.</p>`,rocW16:`<p>An <b>F-16V wing</b> \u2014 Taiwan's most capable fighters, upgraded with AESA
radar and Harpoon anti-ship missiles. Their survival depends on hardened shelters and rapid
runway repair; the PLA plans to destroy them on the ground in the first hours.</p>
<p><i>In game:</i> your best strike aircraft. Rebase it before its runway is cratered.</p>`,rocWIDF:`<p>An <b>Indigenous Defense Fighter (IDF) wing</b> \u2014 Taiwan-built light fighters
carrying the domestic Wan Chien standoff weapon.</p><p><i>In game:</i> a workmanlike
strike/air asset; expendable is a strong word, but protect the F-16s first.</p>`,rocWMir:`<p>A <b>Mirage 2000 wing</b> \u2014 bought from France in the 1990s as high-altitude
interceptors; expensive to maintain and slated for retirement.</p><p><i>In game:</i> air
defense with marginal strike power.</p>`,usCSG:`<p>A <b>US carrier strike group</b> \u2014 a Nimitz/Ford-class carrier, its air wing,
and Aegis escorts. The central US dilemma the game models: carriers must close the fight to
strike, but Chinese ASBMs (DF-21D/DF-26) hold them at risk far out to sea. CSIS wargames
routinely see two US carriers damaged or sunk.</p><p><i>In game:</i> huge striking power and
air points \u2014 and the PLA rocket force's priority target. Keep it moving.</p>`,usSSN:`<p>A <b>US Navy attack submarine</b> \u2014 the platform every wargame of this fight
rates as the decisive killer of the invasion fleet. Undersea superiority is the US military's
clearest remaining edge over the PLA.</p><p><i>In game:</i> hidden, fast, lethal against
shipping. Park it on the amphib routes.</p>`,usWing:`<p><b>USAF fifth-generation fighters</b> flying from Kadena, Okinawa \u2014 the
closest US air base to the strait. Their weakness is the base itself: hundreds of PLA
missiles can reach it, which is why the US now rotates rather than permanently bases
fighters there.</p><p><i>In game:</i> unlocked when Japan commits; powerful, but its base
can be struck.</p>`,usMLR:`<p>The <b>3rd Marine Littoral Regiment</b> \u2014 the Corps' Force Design experiment:
small, mobile teams with NMESIS anti-ship missiles meant to turn straits and islands into
kill zones. Based in Hawaii, it exercises regularly in the Philippines.</p><p><i>In game:</i>
posted at the Luzon EDCA sites overlooking the Bashi Channel \u2014 the strait between Taiwan and
the Philippines that PLAN ships must transit to break out south or east. It fires on any red
ship in reach, and its reach grows if Manila grants full EDCA access (event). It cannot
move: positional deterrence, exactly as designed.</p>`,jpDDG:`<p>A <b>JMSDF escort flotilla</b> \u2014 Maya-class Aegis destroyers among the world's
best air-defense ships. Japan's 2022 security documents call a Taiwan contingency an
existential concern, but committing forces remains a hard political decision.</p>
<p><i>In game:</i> arrives only if Japan enters; excellent defense, strong anti-ship punch,
and ballistic-missile defense for the fleet.</p>`,jpWing:`<p>A <b>JASDF F-35 wing</b>. Japan is buying 147 F-35s \u2014 the largest fleet outside
the US \u2014 and its southwestern islands sit astride every PLA route into the Pacific.</p>
<p><i>In game:</i> joins when Japan commits, adding air points and strike from Kadena.</p>`},Pf={Ningbo:`<p>Headquarters of the PLAN <b>Eastern Theater fleet</b>; its Zhoushan anchorages
host the destroyers and frigates that would escort an invasion. </p><p><i>In game:</i> a red
naval base and staging area on the fleet's northern flank.</p>`,Wenzhou:`<p>A coastal city and airbase midway between Shanghai and the strait; PLA
amphibious exercises are staged from beaches near here.</p><p><i>In game:</i> red airbase
and port supporting the northern axis.</p>`,Fuzhou:`<p>Capital of Fujian province, 250 km from Taipei, and the historic heart of
PLA planning against Taiwan \u2014 the old "Fuzhou Military Region." Its port and airfields would
marshal the northern landing echelons.</p><p><i>In game:</i> a major staging port: amphibious
flotillas load and reload brigades here. Tomahawks can hit it once Deep Strike is authorized.</p>`,"Longtian AB":`<p>One of the <b>Fujian frontline airbases</b> (Longtian/Huian/Zhangzhou)
hardened and expanded since 2020 \u2014 satellite imagery shows new shelters, fuel farms and
missile garrisons across the strait's near shore.</p><p><i>In game:</i> a red fighter base
20 minutes' flight from Taiwan; strikeable with Tomahawks under Deep Strike.</p>`,Quanzhou:`<p>A Fujian port city facing the strait's midpoint, flagged in open-source
analyses as a likely loading point for the invasion's civilian RO-RO ferries.</p>
<p><i>In game:</i> red staging port for the central axis.</p>`,Xiamen:`<p>A metropolis of 5 million directly opposite Kinmen \u2014 the two have traded
artillery fire (1958) and tourists (2008) across 10 km of water. Amphibious brigades
garrison the surrounding coast.</p><p><i>In game:</i> the southern staging port; the Kinmen
garrison's shore batteries can reach shipping at its anchorage.</p>`,Shantou:`<p>A Guangdong port on the invasion's far southern flank, home to Southern
Theater amphibious lift.</p><p><i>In game:</i> a red port and airbase anchoring the southern
approach.</p>`,Matsu:`<p>A ROC-held island group 20 km off Fuzhou \u2014 closer to the mainland than to
Taiwan by a factor of ten. Its garrison shrank from 50,000 troops to a few thousand, but its
tunnels and coastal guns remain. PRC "gray zone" pressure (cable cuttings, drone overflights)
tests it constantly.</p><p><i>In game:</i> a fortress hex whose batteries harass the Fuzhou
staging anchorage. Losing it dents Taiwan's resolve \u2014 but costs the PLA time and ships.</p>`,Kinmen:`<p>The most famous of Taiwan's offshore islands: 10 km from Xiamen, defended
through the 1949 landing battle and the 1958 artillery crisis. Analysts debate whether
Beijing would seize it early as a cheap fait accompli \u2014 or skip it, since taking it might
rally rather than break Taiwanese will.</p><p><i>In game:</i> the AI sometimes opens with a
Kinmen grab. Its garrison cannot be saved \u2014 its job is to make the grab expensive.</p>`,"Penghu (Magong)":`<p>The strait's mid-channel archipelago and Taiwan's forward naval/air
outpost. Every serious invasion study treats Penghu as a stepping stone: taking it first
gives the PLA a protected anchorage, but telegraphs the main landing weeks early.</p>
<p><i>In game:</i> an island airbase and port astride the invasion routes \u2014 its batteries
fire on flotillas that pass within reach.</p>`,Taipei:`<p>Taiwan's capital: the political center whose fall the PLA's "decapitation"
concepts target, ringed by mountains and reachable from the sea only through the Tamsui
river corridor and the port of Keelung. Holding it is holding the war.</p><p><i>In game:</i>
the capital. If PLA troops hold it for two days, organized resistance collapses \u2014 the
principal red victory condition.</p>`,Keelung:`<p>Taiwan's northern deep-water port, the capital's maritime lifeline. In most
invasion scenarios it is blockaded or bombarded early; whoever controls it controls Taipei's
resupply.</p><p><i>In game:</i> a port city guarding Taipei's seaward flank.</p>`,Taoyuan:`<p>Home to Taiwan's main international airport and the beaches flagged in PLA
doctrine as the closest viable landing zones to the capital. The 1949-era defense plans and
today's both mass forces here. An airborne seizure of the airport is a standard scenario
opening.</p><p><i>In game:</i> airbase, city, and a gold-ringed landing beach on the
capital's doorstep \u2014 defend it accordingly.</p>`,Hsinchu:`<p>The heart of the "silicon shield" this game is named for: TSMC's fabs here
make ~90% of the world's leading-edge chips. The theory \u2014 debated by economists and
strategists \u2014 is that this concentration deters war because everyone, China included, needs
the fabs intact. It is also a landing-beach city and fighter base.</p><p><i>In game:</i>
airbase, fabs and beach. Its capture or destruction is a strategic and economic
catastrophe.</p>`,Yilan:`<p>The Lanyang plain on Taiwan's northeast coast \u2014 one of the few flat landing
areas on the mountainous east side, giving access toward Taipei from behind.</p>
