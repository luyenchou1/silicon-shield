<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Silicon Shield</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<style>
/* Silicon Shield HUD — dark ops-room aesthetic, responsive for mobile. */

* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #060d18;
  --panel: rgba(10, 20, 34, 0.88);
  --panel-border: rgba(90, 130, 180, 0.25);
  --text: #dbe6f4;
  --dim: #8fa3bd;
  --blue: #3d8bff;
  --red: #e14b3c;
  --gold: #e8b64c;
  --green: #46b26b;
}

html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
  position: fixed; inset: 0;
}

#app { position: fixed; inset: 0; }
#scene { position: absolute; inset: 0; touch-action: none; overscroll-behavior: none; }
#scene canvas { display: block; touch-action: none; }

/* ---------------------------------------------------------------- topbar */
#topbar {
  position: absolute; top: 0; left: 0; right: 0; min-height: 52px;
  display: flex; align-items: center; gap: 14px;
  /* base 0/12px padding, grown by notch safe-area insets where present (no-op on desktop) */
  padding: max(0px, env(safe-area-inset-top))
           max(12px, env(safe-area-inset-right))
           0
           max(12px, env(safe-area-inset-left));
  background: linear-gradient(180deg, rgba(4, 9, 16, 0.95), rgba(4, 9, 16, 0.6) 80%, transparent);
  z-index: 20; pointer-events: none;
}
#topbar > * { pointer-events: auto; }
#brand {
  font-weight: 800; letter-spacing: 0.16em; font-size: 15px; color: var(--gold);
}
#brand span { color: var(--text); font-weight: 300; margin-left: 4px; }
#turninfo { display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
#dayLabel { font-weight: 700; }
#cpLabel { color: var(--gold); font-weight: 700; }
#topbtns { margin-left: auto; display: flex; gap: 8px; }
#topbtns button, #turninfo { white-space: nowrap; }

button {
  font: inherit; color: var(--text);
  background: rgba(30, 48, 72, 0.9);
  border: 1px solid var(--panel-border);
  border-radius: 8px; padding: 7px 12px; cursor: pointer;
  transition: background 0.15s, transform 0.05s;
}
button:hover:not(:disabled) { background: rgba(50, 76, 110, 0.95); }
button:active:not(:disabled) { transform: scale(0.97); }
button:disabled { opacity: 0.38; cursor: default; }
button.primary { background: #1d4f8f; border-color: #3d77c2; font-weight: 700; }
button.primary:hover:not(:disabled) { background: #2763ad; }

/* ---------------------------------------------------------------- tracks */
#tracks {
  position: absolute; top: 58px; right: 8px; width: 215px;
  background: var(--panel); border: 1px solid var(--panel-border);
  border-radius: 10px; padding: 8px 10px; z-index: 15;
  backdrop-filter: blur(6px);
}
/* strip is desktop-hidden by default; the mobile-collapse media query below
   (max-width: 700px) is the only place that turns it on */
#tracksStrip { display: none; }
.track { display: flex; align-items: center; gap: 6px; margin: 5px 0; font-size: 11px; }
.tlabel { flex: 0 0 78px; color: var(--dim); }
.bar { flex: 1; height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
.intv .fill { background: var(--blue); }
.tw .fill { background: var(--green); }
.prc .fill { background: var(--red); }
.sup .fill { background: var(--gold); }
.tval { flex: 0 0 30px; text-align: right; font-variant-numeric: tabular-nums; }
.airgauge { flex: 1; display: flex; gap: 2px; }
.airgauge i { flex: 1; height: 8px; background: rgba(255,255,255,0.08); border-radius: 2px; }
.airgauge i.on.red { background: var(--red); }
.airgauge i.on.blue { background: var(--blue); }
.airgauge i.on.mid { background: var(--dim); }
.inventories {
  display: flex; justify-content: space-between; gap: 4px;
  margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--panel-border);
  font-size: 11px; color: var(--dim); flex-wrap: wrap;
}
.inventories b { color: var(--text); font-variant-numeric: tabular-nums; }

/* -------------------------------------------------------------- hint bar */
#hintBar {
  position: absolute; top: 58px; left: 50%; transform: translateX(-50%);
  background: rgba(30, 50, 20, 0.92); border: 1px solid #6a9a4a;
  border-radius: 8px; padding: 8px 12px; z-index: 25;
  display: flex; gap: 10px; align-items: center; font-size: 13px;
  max-width: min(480px, 92vw);
}
#hintBar.hidden { display: none; }
#hintCancel { padding: 2px 8px; }

/* ------------------------------------------------------------ unit panel */
#unitPanel {
  position: absolute; left: 8px; bottom: 118px; width: 250px;
  background: var(--panel); border: 1px solid var(--panel-border);
  border-radius: 10px; padding: 10px 12px; z-index: 15;
  backdrop-filter: blur(6px); font-size: 12px;
}
#unitPanel.hidden { display: none; }
#unitClose { position: absolute; top: 6px; right: 6px; padding: 2px 8px; font-size: 11px; }
#unitName { font-size: 14px; padding-right: 26px; }
#unitName.red { color: #ff9b8e; }
#unitName.blue { color: #9cc4ff; }
#unitType { color: var(--dim); margin: 1px 0 4px; }
#unitHp { color: var(--gold); letter-spacing: 2px; margin-bottom: 3px; }
#unitStats { margin-bottom: 3px; }
#unitStatus { color: var(--dim); font-style: italic; }
#unitExtra { margin-top: 5px; color: var(--dim); line-height: 1.45; }
#unitExtra b { color: var(--text); }
#unitButtons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ubtn { font-size: 12px; padding: 5px 9px; }

/* ------------------------------------------------------------ action bar */
#actionBar {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 46px;
  display: flex; gap: 6px; z-index: 15;
  /* base 6px/8px padding, grown by safe-area insets where present (no-op on desktop) */
  padding: 6px max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  background: var(--panel); border: 1px solid var(--panel-border);
  border-radius: 12px; backdrop-filter: blur(6px);
  max-width: 96vw; overflow-x: auto;
}
.actBtn {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  min-width: 58px; padding: 5px 6px; position: relative; border-radius: 9px;
}
.aicon { font-size: 17px; line-height: 1.1; }
.alabel { font-size: 9.5px; color: var(--dim); white-space: nowrap; }
.abadge {
  position: absolute; top: -6px; right: -4px; font-size: 9px;
  background: #24466e; border: 1px solid var(--panel-border);
  padding: 1px 5px; border-radius: 8px; color: var(--gold);
}

/* ------------------------------------------------------------------- log */
#logPanel {
  position: absolute; z-index: 14;
  /* base 8px/8px/6px offsets, grown by safe-area insets where present (no-op on desktop) */
  left: max(8px, env(safe-area-inset-left));
  right: max(8px, env(safe-area-inset-right));
  bottom: max(6px, env(safe-area-inset-bottom));
}
#logToggle {
  width: 100%; text-align: left; font-size: 12px; color: var(--dim);
  background: var(--panel); overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
#logEntries {
  display: none; max-height: 34vh; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--panel-border);
  border-radius: 8px; margin-bottom: 4px; padding: 6px 8px; font-size: 12px;
}
#logPanel.open #logEntries { display: block; }
.logEntry { padding: 3px 2px; border-bottom: 1px solid rgba(255,255,255,0.05); line-height: 1.4; }
.logEntry .lt { color: var(--dim); margin-right: 7px; font-size: 10px; }
.logEntry.alert { color: #ffd9a0; }
.logEntry.event { color: #b9e29a; }
.logEntry.missile { color: #f0a9a0; }
.logEntry.political { color: #a9c8f0; }

/* --------------------------------------------------------------- banners */
#bannerLayer { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
.banner {
  position: absolute; top: 20%; left: 50%; transform: translate(-50%, -20px);
  font-size: clamp(18px, 4vw, 30px); font-weight: 800; letter-spacing: 0.14em;
  color: #ffe1b0; text-shadow: 0 2px 18px rgba(0,0,0,0.9), 0 0 40px rgba(255,120,60,0.4);
  opacity: 0; transition: opacity 0.35s, transform 0.35s; white-space: nowrap;
}
.banner.show { opacity: 1; transform: translate(-50%, 0); }
.toast {
  position: absolute; bottom: 150px; left: 50%; transform: translate(-50%, 10px);
  background: rgba(20, 34, 54, 0.95); border: 1px solid var(--panel-border);
  padding: 8px 16px; border-radius: 8px; font-size: 13px;
  opacity: 0; transition: opacity 0.3s, transform 0.3s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------------------------------------------------------------- modals */
#modalLayer {
  position: absolute; inset: 0; z-index: 40;
  background: rgba(2, 6, 12, 0.72);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(3px);
}
#modalLayer.hidden { display: none; }
.modal {
  width: min(480px, 92vw); max-height: 86vh; overflow-y: auto;
  background: #0c1828; border: 1px solid rgba(120, 160, 210, 0.35);
  border-radius: 14px; padding: 22px 24px;
  box-shadow: 0 18px 60px rgba(0,0,0,0.6);
}
.modal.wide { width: min(640px, 94vw); }
.modal h2 { font-size: 19px; margin-bottom: 12px; color: var(--gold); letter-spacing: 0.04em; }
.modal .mbody { font-size: 13.5px; line-height: 1.55; color: var(--text); }
.modal .mbody p { margin: 8px 0; }
.modal .mbody ul { margin: 8px 0 8px 18px; }
.modal .mbody li { margin: 4px 0; }
.modal .mbody .dim { color: var(--dim); }
.modal .mbtns { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; justify-content: flex-end; }
.modal .mbtns button { min-width: 110px; padding: 10px 16px; }

/* after-action report */
.aar-h { color: var(--gold); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; margin: 14px 0 6px; }
.aar-grid {
  display: grid; grid-template-columns: auto 1fr; gap: 3px 14px;
  font-size: 12.5px; align-items: baseline;
}
.aar-k { color: var(--dim); white-space: nowrap; }
.aar-v { font-variant-numeric: tabular-nums; }
.aar-timeline { max-height: 32vh; overflow-y: auto; font-size: 12.5px; border-top: 1px solid var(--panel-border); }
.aar-t { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.06); line-height: 1.45; }
.aar-day { color: var(--gold); font-weight: 700; margin-right: 8px; font-variant-numeric: tabular-nums; }

.diffCard {
  border: 1px solid var(--panel-border); border-radius: 10px;
  padding: 10px 12px; margin: 8px 0; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.diffCard:hover { border-color: var(--gold); background: rgba(232, 182, 76, 0.07); }
.diffCard b { color: var(--gold); }
.diffCard .dim { display: block; font-size: 12px; margin-top: 2px; }

/* ---------------------------------------------------------------- mobile */
@media (max-width: 760px) {
  #brand { display: none; }
  /* five controls across 375px: tighten so the menu button isn't clipped */
  #topbar { gap: 6px; }
  #topbtns { gap: 4px; }
  #topbtns button { padding-left: 8px; padding-right: 8px; font-size: 13px; }
  #turninfo { font-size: 13px; }
  #tracks {
    top: auto; bottom: 96px; right: 4px; left: auto; width: 178px;
    font-size: 10px; padding: 6px 8px;
  }
  .tlabel { flex-basis: 64px; }
  #unitPanel { left: 4px; right: auto; bottom: 96px; width: min(230px, 55vw); }
  #actionBar {
    bottom: 36px; gap: 4px;
    padding: 5px max(6px, env(safe-area-inset-right)) max(5px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
  }
  .actBtn { min-width: 50px; }
  #logPanel { bottom: max(4px, env(safe-area-inset-bottom)); }
  #topbar { min-height: 46px; }

  /* -------------------------------------------------- unit panel: phones
     Cap the panel so it can never grow tall enough to cover the action
     bar; #unitClose stays put (position:absolute against #unitPanel, its
     own positioned + scrolling ancestor) so it never scrolls out of reach. */
  #unitPanel { max-height: 45vh; overflow-y: auto; }

  /* ------------------------------------------------------- modals: phones
     Was: overflow-y:auto on .modal itself, so long content dragged the
     title and button row along with it and off-screen. Now the modal is a
     fixed-height column with title/buttons pinned and only .mbody scrolling. */
  .modal {
    max-height: 85vh; max-height: 85dvh;
    display: flex; flex-direction: column; overflow-y: hidden;
  }
  .modal h2, .modal .mbtns { flex: 0 0 auto; }
  .modal .mbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
}

/* ------------------------------------------------- tracks collapse: phones
   Below ~700px the #tracks panel would otherwise eat the lower-right
   quarter of the map, so it collapses to a one-row strip of dots/values;
   tapping the strip (see UI._buildTracks in src/ui.js) toggles #tracks's
   .collapsed class. #tracksStrip defaults to display:none (base rule near
   #tracks above) and is only switched on here, and default-collapsed state
   is only ever set below this breakpoint (matchMedia check in
   _buildTracks). */
@media (max-width: 700px) {
  #tracksStrip {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; line-height: 1; cursor: pointer;
    white-space: nowrap;
  }
  #tracks:not(.collapsed) #tracksStrip {
    margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--panel-border);
  }
  /* collapsed strip is wider than the fixed 178px panel — size to content */
  #tracks.collapsed { padding: 7px 9px; width: auto; max-width: calc(100vw - 12px); }
  #tracks.collapsed .track,
  #tracks.collapsed .inventories { display: none; }
}

/* --------------------------------------------- touch targets: coarse pointers
   Apple/Google HIG minimum is ~44px; the desktop-tuned buttons below run
   smaller than that, which is fine for a mouse but too fiddly for a
   fingertip. Bump the hit area on touch devices only — mouse/trackpad
   layouts (and their tighter spacing) are untouched. */
@media (pointer: coarse) {
  .actBtn, .ubtn, #endTurnBtn, #menuBtn, #muteBtn, #unitClose {
    min-width: 44px; min-height: 44px;
  }
  /* the close button grew — give the title more clearance so they don't overlap */
  #unitName { padding-right: 48px; }

  /* ---------------------------------------------- action bar: coarse pointers
     Horizontal scroll already existed (overflow-x:auto); add the affordances
     a touch user expects: inertial (momentum) scrolling, buttons that snap
     into place instead of landing half-cut, and a subtle fade over the
     trailing edge that only shows while there's more to scroll to (a pure-CSS
     scroll-shadow: a "cover" gradient scrolls with the content — attachment:
     local — matching the fade until the last button reaches the edge, at
     which point it no longer covers it). */
  #actionBar {
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
    background:
      linear-gradient(to left, var(--panel) 40%, rgba(0,0,0,0)) right center / 32px 100% local no-repeat,
      linear-gradient(to left, rgba(2,6,12,0.55), rgba(2,6,12,0)) right center / 18px 100% scroll no-repeat,
      var(--panel);
  }
  .actBtn { scroll-snap-align: start; }
}

</style>
</head>
<body>
  <div id="app">
    <div id="scene"></div>

    <header id="topbar">
      <div id="brand">SILICON<span>SHIELD</span></div>
      <div id="turninfo">
        <span id="dayLabel">D+1</span>
        <span id="cpLabel">CP 6</span>
      </div>
      <div id="topbtns">
        <button id="endTurnBtn" class="primary">End Turn ⏵</button>
        <button id="menuBtn" title="Menu">☰</button>
      </div>
    </header>

    <aside id="tracks"></aside>

    <div id="hintBar" class="hidden"><span></span><button id="hintCancel">✕</button></div>

    <section id="unitPanel" class="hidden">
      <button id="unitClose">✕</button>
      <h3 id="unitName"></h3>
      <div id="unitType"></div>
      <div id="unitHp"></div>
      <div id="unitStats"></div>
      <div id="unitStatus"></div>
      <div id="unitExtra"></div>
      <div id="unitButtons"></div>
    </section>

    <nav id="actionBar"></nav>

    <section id="logPanel">
      <button id="logToggle"><span id="logLatest">Situation reports…</span></button>
      <div id="logEntries"></div>
    </section>

    <div id="bannerLayer"></div>
    <div id="modalLayer" class="hidden"></div>
  </div>

break, Taiwan's resolve.</p><p><i>In game:</i> immobile fortress with shore batteries \u2014 it

<p><i>In game:</i> a ship-killer that dies fast in the open. Use it from coastal hexes,

runway repair; the PLA plans to destroy them on the ground in the first hours.</p>

strike, but Chinese ASBMs (DF-21D/DF-26) hold them at risk far out to sea. CSIS wargames

clearest remaining edge over the PLA.</p><p><i>In game:</i> hidden, fast, lethal against
shipping. Park it on the amphib routes.</p>`,usWing:`<p><b>USAF fifth-generation fighters</b> flying from Kadena, Okinawa \u2014 the

missiles can reach it, which is why the US now rotates rather than permanently bases
fighters there.</p><p><i>In game:</i> unlocked when Japan commits; powerful, but its base

move: positional deterrence, exactly as designed.</p>`,jpDDG:`<p>A <b>JMSDF escort flotilla</b> \u2014 Maya-class Aegis destroyers among the world's
best air-defense ships. Japan's 2022 security documents call a Taiwan contingency an
existential concern, but committing forces remains a hard political decision.</p>
<p><i>In game:</i> arrives only if Japan enters; excellent defense, strong anti-ship punch,
and ballistic-missile defense for the fleet.</p>`,jpWing:`<p>A <b>JASDF F-35 wing</b>. Japan is buying 147 F-35s \u2014 the largest fleet outside

river corridor and the port of Keelung. Holding it is holding the war.</p><p><i>In game:</i>

little infrastructure, but ground worth holding.</p>`,"Okinawa (Kadena)":`<p><b>Kadena Air Base</b> \u2014 the largest US air base in the Pacific,

PLA strike Kadena on day one (bringing Japan in) or leave it alone (and cede US airpower)?
